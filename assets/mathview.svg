<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>MathView</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171b"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#g)"
        stroke="#2a2a31" stroke-width="2"/>
  <!-- axes -->
  <path d="M28 96 H104" stroke="#2a2a31" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 96 V30" stroke="#2a2a31" stroke-width="3" stroke-linecap="round"/>
  <!-- linear: cyan. glow first, then the stroke -->
  <path d="M28 92 L104 44" stroke="#2cdcff" stroke-width="12" stroke-linecap="round" opacity="0.18"/>
  <path d="M28 92 L104 44" stroke="#2cdcff" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- exponential: orange -->
  <path d="M28 94 Q74 92 88 68 T104 24" stroke="#ff8734" stroke-width="12"
        stroke-linecap="round" fill="none" opacity="0.18"/>
  <path d="M28 94 Q74 92 88 68 T104 24" stroke="#ff8734" stroke-width="6"
        stroke-linecap="round" fill="none"/>
  <!-- the crossing: red, chrome-only, exactly as in the app -->
  <circle cx="86" cy="63" r="13" fill="#ff2740" opacity="0.25"/>
  <circle cx="86" cy="63" r="6.5" fill="#ff2740"/>
</svg>
